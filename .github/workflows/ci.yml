name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CI: true
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Source Link writes the commit into the symbols, and the package records it. A shallow
          # clone still has the sha, but the full history is what makes the recorded commit
          # resolvable from the package by anyone debugging it.
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      # TreatWarningsAsErrors is set in Directory.Build.props; -warnaserror also promotes
      # warnings raised outside compilation, such as NuGet restore warnings.
      - name: Build
        run: dotnet build -c Release --no-restore -warnaserror

      # Includes the architecture guards that enforce the core's independence.
      - name: Test
        run: dotnet test -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Pack
        run: dotnet pack -c Release --no-build -o artifacts

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/*.trx'
          if-no-files-found: ignore

      # Symbols alongside the package: a preview nobody can step into is a preview whose bug
      # reports are guesses.
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error
